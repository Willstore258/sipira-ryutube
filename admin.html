```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Sipira Shop</title>

<style>
body{
    font-family:sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#333;
}

/* LOGIN */
.login-container{
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

/* DASHBOARD */
.dashboard{display:none;padding:20px;}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.btn{background:#2563eb;color:white;}
.btn-danger{background:red;color:white;}

.product{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    background:#f1f5f9;
    padding:10px;
    border-radius:10px;
    align-items:center;
}

.product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-container">
<h2>Login Admin</h2>

<form onsubmit="login(event)">
<input id="user" placeholder="Username" required>
<input id="pass" type="password" placeholder="Password" required>
<button class="btn">Login</button>
</form>

<p>admin / 123456</p>
</div>

<!-- DASHBOARD -->
<div id="dash" class="dashboard">

<h2 style="color:white;">Dashboard Sipira Shop</h2>

<!-- MUSIK -->
<div class="card">
<h3>🎵 Musik Website</h3>

<input id="musicLink" placeholder="Link musik (mp3)">
<button class="btn" onclick="saveMusic()">Simpan Musik</button>

<br><br>
<audio id="player" controls autoplay loop style="width:100%;"></audio>
</div>

<!-- TAMBAH PRODUK -->
<div class="card">
<h3>Tambah Produk</h3>

<input id="title" placeholder="Nama Produk">
<input id="price" placeholder="Harga">
<input id="image" placeholder="Link Gambar (https://...)">
<textarea id="desc" placeholder="Deskripsi"></textarea>

<button class="btn" onclick="add()">Tambah</button>
</div>

<!-- LIST PRODUK -->
<div class="card">
<h3>Produk</h3>
<div id="list"></div>
</div>

</div>

<script>
const USER="admin";
const PASS="123456";

/* LOGIN */
function login(e){
e.preventDefault();

if(user.value===USER && pass.value===PASS){
login.style.display="none";
dash.style.display="block";
load();
}else{
alert("Login salah!");
}
}

/* DATA */
function getData(){
return JSON.parse(localStorage.getItem("produk"))||[];
}

function saveData(data){
localStorage.setItem("produk",JSON.stringify(data));
}

/* LOAD */
function load(){
loadProduk();
loadMusic();
}

/* PRODUK */
function loadProduk(){
let data=getData();
list.innerHTML="";

data.forEach(p=>{
list.innerHTML+=`
<div class="product">
<img src="${p.image}" onerror="this.src='https://via.placeholder.com/70'">
<div style="flex:1">
<b>${p.title}</b><br>
${p.price}
</div>
<button class="btn-danger" onclick="hapus(${p.id})">X</button>
</div>
`;
});
}

function add(){
if(!title.value || !price.value){
alert("Isi dulu!");
return;
}

let data=getData();

data.unshift({
id:Date.now(),
title:title.value,
price:price.value,
image:image.value || "https://via.placeholder.com/70",
desc:desc.value
});

saveData(data);
loadProduk();

title.value="";
price.value="";
image.value="";
desc.value="";
}

function hapus(id){
let data=getData().filter(p=>p.id!==id);
saveData(data);
loadProduk();
}

/* MUSIK */
function saveMusic(){
localStorage.setItem("music", musicLink.value);
loadMusic();
alert("Musik disimpan!");
}

function loadMusic(){
let link = localStorage.getItem("music");
if(link){
player.src = link;
}
}
</script>

</body>
</html>
```
